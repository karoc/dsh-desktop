<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DSH Smoothly Desktop</title>
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      /* 启动页保持深色（黑底）：与白色主题的其余壳界面区分，光辉动效也更醒目 */
      :root {
        color-scheme: dark;
        --bg: #0d1117;
        --card: #161b22;
        --border: #30363d;
        --fg: #e6edf3;
        --muted: #8b949e;
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="hero">
        <div class="logo" aria-hidden="true"><img src="logo.png" width="64" height="64" alt="" draggable="false"></div>
        <h1>DeepSeek Harness</h1>
        <p class="state" id="state">正在启动 dsh 服务…</p>
        <div class="spinner" id="spinner" aria-hidden="true"></div>
        <div class="install-progress" id="installProgress" hidden aria-hidden="true">
          <div class="install-progress-bar"></div>
        </div>
        <button id="retry" hidden>重试</button>
        <button id="opendata" class="secondary" hidden>打开数据目录（看 manager.log）</button>
        <div class="legacy-banner" id="legacyBanner" hidden>
          <span id="legacyBannerText">检测到旧版（0.3.x）残留。</span>
          <button id="legacyCleanBtn" class="primary">清理并卸载旧版</button>
          <button id="legacyLaterBtn" class="secondary">稍后</button>
        </div>
      </div>
      <div class="credits-viewport">
        <div class="credits" id="credits" aria-live="polite"></div>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
