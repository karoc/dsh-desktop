<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DSH Smoothly Desktop — 插件管理</title>
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .pane { padding: 18px 22px 28px; max-width: 860px; margin: 0 auto; }
      .pane-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
      .pane-head h1 { font-size: 17px; margin: 0; }
      .pane-head button { margin: 0; }
      .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }
      .card h2 { margin: 0 0 6px; font-size: 14px; }
      .card .hint { margin: 0 0 10px; }
      .upd-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 2px 0 8px; }
      .upd-row .ver { font-variant-numeric: tabular-nums; }
      .plug-row { display: flex; align-items: center; gap: 10px; padding: 7px 4px; border-bottom: 1px solid rgba(0,0,0,0.05); }
      .plug-row:last-child { border-bottom: 0; }
      .plug-name { font-weight: 600; min-width: 210px; }
      .plug-desc { flex: 1; color: var(--muted); font-size: 12px; min-width: 120px; }
      .plug-actions { display: flex; gap: 6px; }
      .plug-actions button { margin: 0; padding: 4px 10px; font-size: 12px; }
      .install-row { display: flex; gap: 8px; margin-top: 8px; }
      .install-row input { flex: 1; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--fg); font-size: 13px; }
      .install-row button { margin: 0; padding: 7px 14px; }
      #restartBanner { display: none; align-items: center; gap: 12px; background: #fff4e0; border: 1px solid #e6a23c; color: #8a4b00; border-radius: 10px; padding: 8px 14px; margin-bottom: 12px; font-size: 13px; }
      #restartBanner button { margin: 0; padding: 4px 12px; }
      #statusLine { color: var(--muted); min-height: 1.5em; font-size: 13px; margin-top: 10px; }
      #statusLine.ok { color: #2e7d32; }
      #statusLine.err { color: #c62828; }
      .badge { display: inline-block; background: rgba(31,111,235,0.12); color: #1f6feb; border-radius: 10px; padding: 1px 8px; font-size: 11px; margin-left: 6px; }
      .muted.small { font-size: 12px; }
    </style>
  </head>
  <body>
    <section class="pane">
      <header class="pane-head">
        <h1>插件管理</h1>
        <button id="closeBtn" class="secondary" type="button">关闭</button>
      </header>

      <div id="restartBanner">
        <span>部分改动需要重启服务后生效。</span>
        <button id="restartNowBtn" type="button">立即重启服务</button>
        <button id="restartDismissBtn" class="secondary" type="button">知道了</button>
      </div>

      <div class="card">
        <h2>dsh 更新</h2>
        <p class="muted small hint">dsh 本体来自官方 npm 包；稳定版/预发布想升才升。</p>
        <div class="upd-row">
          <span class="ver">当前 <strong id="updCurrent">…</strong></span>
          <span class="ver">最新 <strong id="updLatest">…</strong></span>
          <span id="updNextBadge" class="badge" hidden>预发布可升</span>
          <button id="updCheckBtn" type="button">检查更新</button>
          <button id="updNowBtn" class="primary" type="button" hidden>一键更新</button>
        </div>
      </div>

      <div class="card">
        <h2>预装插件</h2>
        <p class="muted small hint">随壳自带，默认关闭；勾选启用后重启服务生效。</p>
        <div class="upd-row">
          <button id="preCheckBtn" type="button">检查预装更新</button>
        </div>
        <div id="preinstalledList"></div>
      </div>

      <div class="card">
        <h2>用户插件</h2>
        <p class="muted small hint">输入 GitHub 地址或 npm 包名安装（经内置 pnpm + dsh plugin CLI）。</p>
        <div class="install-row">
          <input id="installInput" placeholder="github:user/repo 或 npm 包名" autocomplete="off" spellcheck="false" />
          <button id="installBtn" class="primary" type="button">安装</button>
        </div>
        <div id="userPluginsList"></div>
      </div>

      <div id="statusLine" role="status"></div>
    </section>
    <script src="plugin-console.js"></script>
  </body>
</html>
