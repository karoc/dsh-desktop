# ── dsh 自动化日志轮转模板（A8）───────────────────────────────────────────────
#
# 背景（docs/2026-10-24-alerting-and-idempotency-patterns.md §5.1–5.3）：
# 三个 systemd user timer 的服务都用 `StandardOutput=append:` / `StandardError=append:` 指向
# `~/.dsh/logs/*.log`。systemd 的 `append:` **只保证不截断，不保证不涨破磁盘** —— man page 里
# 没有任何 rotate / maxsize / keep 选项，轮转必须由外部做（本机此前 `/etc/logrotate.d/` 没有 dsh 条目）。
#
# 为什么用 copytruncate：进程（systemd）一直持有 append 模式下打开的 fd，我们**不能**通知它 reopen
# （那要重启服务）。logrotate 的 copytruncate 是这种场景的标准做法：先把内容复制走，再把原文件原地
# 截断为 0，持有 fd 的进程继续往同一个 inode 追加。代价是"复制 → 截断"之间有一个极小的丢数据窗口
# （logrotate man 明确写了），自动化告警日志接受这个代价。
#
# 用法（**用户级，不碰本机 systemd、不需要 root**）：
#   sed "s|@HOME@|$HOME|g" scripts/logrotate.dsh.conf > ~/.dsh/logrotate.dsh.conf
#   /usr/sbin/logrotate -d ~/.dsh/logrotate.dsh.conf        # 干跑：只检查语法/匹配，不动文件
#   /usr/sbin/logrotate -s ~/.dsh/logrotate.status ~/.dsh/logrotate.dsh.conf   # 真跑一次
# 定时：systemd user timer 模板见 README「日志与状态文件在哪、怎么清理」一节
#   （`dsh-logrotate.service` + `.timer`；与本文件同一套参数，别只装一半）。
#
# 若改走 `/etc/logrotate.d/dsh`（root，logrotate.timer 每天跑一次）：把本文件的 `@HOME@` 换成
# 真实绝对路径，并**加一行** `su <user> <group>`（root 在别人家目录里创建/压缩轮转文件时，
# 较新的 logrotate 会要求显式声明属主）。两种方式二选一，不要同时装 —— 两份配置会互相抢文件。
#
# 覆盖范围刻意**只列三个 timer 日志**：`dsh-web.out.log`（0600）由 dsh-web.service 自己的
# 上一份轮转（`.prev.log`）负责，这里再轮一次会与它抢文件；要纳管就先把那套逻辑删掉再统一。
@HOME@/.dsh/logs/dsh-watch-timer.log
@HOME@/.dsh/logs/dsh-autopilot.log
@HOME@/.dsh/logs/dsh-tagdispatch.log
{
    # 时间条件
    daily
    # 大小条件：即使还没到 daily，涨过 20M 也轮（`maxsize` 是"提前触发"，不是"上限"）
    maxsize 20M
    # 保留 7 份（≈7 天 / 7×20M 压缩后约几十 MB）
    rotate 7
    compress
    # 刚轮转出来的那一份先不压：排查时最常看的就是它
    delaycompress
    # 日志不存在（机器上没装某个 timer）不算错
    missingok
    # 空文件不轮转（不制造零字节垃圾）
    notifempty
    # 进程持有 append fd，不能 reopen ⇒ 复制后原地截断（见文件头说明）
    copytruncate
}
