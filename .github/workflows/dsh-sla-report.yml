# dsh 升级 SLA 报表（方案 P2）—— 每周出「官方发布 → 我们发出稳定版」的真实耗时并 upsert 到 issue。
#
# 信号分离（首次实跑暴露的缺陷修正）：原先报表与门禁同一步，导致"SLA 未达标"与"job 坏了"都是红色、
# 无法区分。现在拆成两步：
#   ① 生成报表 —— 恒绿（它的职责是发布报表；报表已写进 step summary 与 issue）
#   ② SLA 门禁（未达标即红）—— 只有它红才代表"最近 N 个版本超 6h"，步骤名字自解释
# 历史数据不会让门禁恒红：只检查最近 `--recent 3` 个版本。
name: dsh-sla-report

on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: dsh-sla-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # 需要读 tag 树上的 MIN_DSH_VERSION，并 git log -G 找地板提交

      - name: 生成 SLA 报表（写 summary + upsert issue）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_BIN: gh
        run: node scripts/dsh-sla-report.mjs --issue --json /tmp/sla.json

      - name: SLA 门禁（未达标即红）
        run: node scripts/dsh-sla-report.mjs --check /tmp/sla.json --recent 3
