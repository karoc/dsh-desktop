name: build
on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      # beforeBuildCommand fetches the pinned Node runtime and syncs resources
      - run: npm run bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # Optional: Linux AppImage/deb for convenience (unsigned). Windows is the
  # primary target; this job keeps a handy fallback for local Linux testing.
  linux:
    runs-on: ubuntu-latest
    needs: windows
    if: ${{ false }} # enable by flipping to true when you want Linux bundles too
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run bundle -- --bundles appimage deb
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error