name: build
on:
  # Layered pipeline (GitHub Flow): PRs run only the fast gate (check+test);
  # main pushes and v* tags run the full gate (windows/linux packaging + smoke)
  # so a 20-min Windows bundle is never burned on a PR iteration.
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A re-cut re-pushes the same tag; cancel any run still racing on the same ref
# so release creation/asset upload never collide.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: every job is read-only; only `release` overrides to
# contents: write for publishing.
permissions:
  contents: read

jobs:
  # Fast gate: compile the Rust crate in ~4-8 min (cached). Everything else
  # depends on it so compile errors never burn a full 20-min bundle round-trip.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # 2026-10-15：**一行级**修复（本仓 CI 文件只允许最小改动 —— 之前两次块级编辑把整个 workflow 弄成"零作业"）。
        # 原「文档同步」门禁用 `git diff origin/<base>...HEAD` 取变更列表，而默认浅克隆（fetch-depth: 1）拿不到
        # base 对象 ⇒ 取不到就"未触及行为文件，跳过"= **静默放行（假阴性门禁）**。给它完整历史即可。
        with:
          fetch-depth: 0
      - id: changed
        name: 变更范围判定（板卡专属变更跳过重步骤；必过检查仍照常上报）
        # 2026-10-07 三次修正，记在这里免得再踩：
        # ① `git diff origin/<base>...HEAD`：PR 事件浅克隆拿不到对象 ⇒ 实测 `<none>` ⇒ 重步骤照跑（快只是缓存）。
        # ② 事件 base SHA + `git fetch`：**依赖网络**，实测两次运行结果不一致（PR #122 true / PR #123 `<none>`）。
        #    ⇒ 门禁的输入不能飘。
        # ③ 用逐行替换改本步骤时收尾条件写错，**旧块整段留在新块后面**（同一步骤出现重复 name/run）
        #    ⇒ GitHub 拒收整个 workflow，run 变成 **零作业**（`total_count: 0`），而本地 PyYAML 默默容忍重复键。
        #    ⇒ 教训：改 workflow 后必须额外做"步骤内重复键"自检，不能只 `yaml.safe_load`。
        # 本版：**不联网**。PR 事件检出的就是合并提交，`HEAD^1` 即 base ⇒ 本地 diff（失败退 `HEAD^`）。
        # fail-safe：diff 失败或为空 ⇒ 按"有变更"处理（宁可多跑，绝不误跳过门禁）。
        run: |
          set -u
          files=""
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            files=$(git diff --name-only HEAD^1 HEAD 2>/dev/null || echo "")
            [ -z "$files" ] && files=$(git diff --name-only HEAD^ HEAD 2>/dev/null || echo "")
          else
            files=$(git diff --name-only HEAD^ HEAD 2>/dev/null || echo "")
          fi
          rest=$(printf '%s\n' "$files" | grep -v '^KANBAN.json$' | grep -v '^$' || true)
          if [ -n "$files" ] && [ -z "$rest" ]; then board_only=true; else board_only=false; fi
          echo "board_only=$board_only" >> "$GITHUB_OUTPUT"
          echo "event=${GITHUB_EVENT_NAME} files=(${files:-<none>}) ⇒ board_only=$board_only"
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # tauri-build validates bundle.resources at compile time, so materialize
      # the gitignored resources before checking.
      - run: node scripts/fetch-node.mjs
      - run: node scripts/sync-resources.mjs
      - run: cargo check --manifest-path src-tauri/Cargo.toml
        if: steps.changed.outputs.board_only != 'true'
      # Quality gate: the crate must be clippy-clean, not merely compile.
      # cargo fmt --check is DISABLED until the one-shot formatting PR lands
      # (60 legacy format diffs predate the gate; run `cargo fmt` on a machine
      # with the Rust toolchain, commit as style(chrome): cargo fmt, then
      # re-enable: `- run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check`).
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
        if: steps.changed.outputs.board_only != 'true'
      # Rust unit tests (lib): migration logic & any pure-path logic.
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
        if: steps.changed.outputs.board_only != 'true'

  # Fast node gate (no Rust/system deps, ~1 min): all scripts/test-*.mjs
  # behavioral + contract suites (notifications / control plane / console /
  # proxy / launcher settings / shell chrome contract).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # 2026-10-15：**一行级**修复（本仓 CI 文件只允许最小改动 —— 之前两次块级编辑把整个 workflow 弄成"零作业"）。
        # 原「文档同步」门禁用 `git diff origin/<base>...HEAD` 取变更列表，而默认浅克隆（fetch-depth: 1）拿不到
        # base 对象 ⇒ 取不到就"未触及行为文件，跳过"= **静默放行（假阴性门禁）**。给它完整历史即可。
        with:
          fetch-depth: 0
      - id: changed
        name: 变更范围判定（板卡专属变更跳过重步骤；必过检查仍照常上报）
        # 2026-10-07 三次修正，记在这里免得再踩：
        # ① `git diff origin/<base>...HEAD`：PR 事件浅克隆拿不到对象 ⇒ 实测 `<none>` ⇒ 重步骤照跑（快只是缓存）。
        # ② 事件 base SHA + `git fetch`：**依赖网络**，实测两次运行结果不一致（PR #122 true / PR #123 `<none>`）。
        #    ⇒ 门禁的输入不能飘。
        # ③ 用逐行替换改本步骤时收尾条件写错，**旧块整段留在新块后面**（同一步骤出现重复 name/run）
        #    ⇒ GitHub 拒收整个 workflow，run 变成 **零作业**（`total_count: 0`），而本地 PyYAML 默默容忍重复键。
        #    ⇒ 教训：改 workflow 后必须额外做"步骤内重复键"自检，不能只 `yaml.safe_load`。
        # 本版：**不联网**。PR 事件检出的就是合并提交，`HEAD^1` 即 base ⇒ 本地 diff（失败退 `HEAD^`）。
        # fail-safe：diff 失败或为空 ⇒ 按"有变更"处理（宁可多跑，绝不误跳过门禁）。
        run: |
          set -u
          files=""
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            files=$(git diff --name-only HEAD^1 HEAD 2>/dev/null || echo "")
            [ -z "$files" ] && files=$(git diff --name-only HEAD^ HEAD 2>/dev/null || echo "")
          else
            files=$(git diff --name-only HEAD^ HEAD 2>/dev/null || echo "")
          fi
          rest=$(printf '%s\n' "$files" | grep -v '^KANBAN.json$' | grep -v '^$' || true)
          if [ -n "$files" ] && [ -z "$rest" ]; then board_only=true; else board_only=false; fi
          echo "board_only=$board_only" >> "$GITHUB_OUTPUT"
          echo "event=${GITHUB_EVENT_NAME} files=(${files:-<none>}) ⇒ board_only=$board_only"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync derived Cargo.lock version (before npm test)
        # 2026-10-10：条件原来是"仅 tag"，于是 **release-please 的发布 PR 自己跑 npm test 时**
        # Cargo.lock 仍是旧版本 ⇒ 四版本一致门禁必然红 ⇒ 本仓的发布 PR 在结构上永远过不了"两项检查全绿"
        # （历史遗留：这也是 v0.15.0 那次发布事故的同一根因，而当时的修复只覆盖了 tag 构建那一侧）。
        # 2026-10-16：**条件整个去掉**，任何跑 npm test 的场合都先同步。原因是一条实测出来的死循环：
        # release-please 只改 package.json / tauri.conf.json / Cargo.toml，**不动 Cargo.lock** ⇒
        # 合并发布 PR 后的 main 内容就是漂移的 ⇒ 此后**每一个**基于 main 的 PR 都会红在"四处版本一致"
        # （v0.18.1 实测：PR #164 的 test job 7 秒红）。让派生文件在测试前对齐，比让 CI 常红更诚实 ——
        # 常红会掩盖真失败。**代价说清楚**：这一门禁因此不再能抓"手改 Cargo.toml 漏改 Cargo.lock"，
        # 但该漂移不影响任何出厂产物（tag / main 的打包路径本来就先同步；上游那次是 Cargo.lock 停在
        # 0.15.0 而 Cargo.toml 已 0.16.0，属于**发布产物**层面的问题，仍被这一行挡住）。
        run: node scripts/sync-cargo-lock-version.mjs
      - run: npm test
        if: steps.changed.outputs.board_only != 'true'
      # 2026-10-22：CI 辅助逻辑的负向对照。两套脚本都必须能"证明自己会红"，
      # 否则「修好了 linux-smoke / 给 choco 加了重试」只是口头承诺：
      #   · ci-choco-install 自检：2 次失败后成功 ⇒ 绿；3 次全失败 ⇒ 红；已装 ⇒ 不碰网络；首次成功 ⇒ 只跑 1 次。
      #   · ci-linux-smoke 自检：静默 app / 假 resources / 缺 node / 无 URL / 早退 / 缺 deb ⇒ 必须红；
      #     完整链路 ⇒ 必须绿（用桩二进制 + 桩 xvfb/dbus，不需要真实 WebKitGTK）。
      # 纯 Node、无外部依赖、合计 ~10s，放快层跑，PR 阶段就能挡住"把门禁改成永真"的回归。
      - name: CI 辅助脚本自检（choco 重试 / linux smoke 判据）
        if: steps.changed.outputs.board_only != 'true'
        run: |
          node scripts/ci-choco-install.mjs --self-test
          node scripts/test-ci-linux-smoke.mjs
      - name: 文档同步（改了壳/manager 行为文件 ⇒ 同 PR 必须改 README，除非打 docs-not-needed 标签）
        if: steps.changed.outputs.board_only != 'true'
        run: |
          set -e
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "非 PR 事件，跳过"; exit 0
          fi
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" || echo "")
          behavior=$(printf '%s\n' "$files" | grep -E '^(src-tauri/resources/ui/shell-chrome\.js|scripts/server-manager\.mjs)$' || true)
          if [ -z "$behavior" ]; then echo "未触及行为文件，跳过"; exit 0; fi
          labels='${{ join(github.event.pull_request.labels.*.name, ',') }}'
          case ",$labels," in *,docs-not-needed,*) echo "已打 docs-not-needed 标签，放行"; exit 0;; esac
          if ! printf '%s\n' "$files" | grep -q '^README\.md$'; then
            echo "❌ 改了 $behavior 但本 PR 未改 README.md。"; 
            echo "   行为变了文档就要同步（文档是交付物）；确实不需要时给 PR 打 docs-not-needed 标签。"; exit 1
          fi
          echo "✅ README 已同步"

  # Full gate — main push / tag only (not on PRs): NSIS bundle + layout
  # assertion + runtime smoke (release gate, see scripts/smoke-windows.mjs).
  rust-coverage:
    # 2026-10-15：Rust 侧覆盖率基线（**只报告，不设阈值** —— 先有数字，再谈门槛）。
    # 设计取舍：① 独立作业、非必过（不拖慢 PR 的 check/test）；② 只在 push 到 main / tag 时跑
    # （度量是给"改哪里最值得"用的，不需要每个 PR 都算一遍）。
    # 前置步骤与 check 作业保持一致（Tauri 的系统依赖 + 生成的资源文件）。
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: node scripts/fetch-node.mjs
      - run: node scripts/sync-resources.mjs
      # 报告 lib.rs 等的行覆盖率汇总（--summary-only 直接打在日志里，便于抓取与对比）
      - name: Rust 覆盖率（lib，只报告）
        run: cargo llvm-cov --manifest-path src-tauri/Cargo.toml --lib --summary-only
  windows:
    if: github.event_name != 'pull_request'
    needs: [check, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri-build validates bundle.resources at compile time (see the check
      # job), so the gitignored resources must exist before ANY cargo command —
      # including the unit tests below. Same prep the check job runs.
      - run: node scripts/fetch-node.mjs
      - run: node scripts/sync-resources.mjs

      # Windows-only Rust unit tests. `path_under` / `strip_verbatim` and the
      # dump / job-object code are `#[cfg(windows)]`: the ubuntu `check` job
      # compiles a DIFFERENT variant, so platform logic would otherwise ship
      # untested (the 2026-09 path-guard work depends on exactly these).
      # Runs before `npm run bundle` so a failure does not burn the ~20 min
      # packaging round-trip.
      - name: Rust unit tests (Windows-specific code paths)
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - run: npm ci

      # beforeBuildCommand fetches the pinned Node runtime and syncs resources
      - run: npm run bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Layout assertion: the packaged installer must actually contain the
      # bundled Node at the exact path the Rust probe expects.
      - name: Install 7zip (for NSIS inspection)
        shell: pwsh
        # 2026-10-22：这一行原来直接 `choco install 7zip -y --no-progress`，社区源一次 499 就
        # 把整个 windows（连带 tag 的 release）拖红（run 39282899675：
        # "Failed to fetch results from V2 feed … Response status code does not indicate success: 499"
        # ⇒ installed 0/1 ⇒ exit 1）。现改为 scripts/ci-choco-install.mjs：
        #   · 7-Zip 已在 runner 上（断言步骤用的同一个 C:\Program Files\7-Zip\7z.exe）⇒ 完全不碰社区源；
        #   · 否则有界重试：最多 3 次、间隔 25s、每次打印原因 + 输出尾巴；`--no-progress --limit-output` 缩小 V2 往返体积；
        #   · 预算耗尽 ⇒ exit 1（不吞错 —— 缺 7-Zip 时下面的 NSIS 布局断言会静默失效，那才是真事故）。
        # 逻辑自检见 test 作业的 "CI 辅助脚本自检"（含 2 失败后成功 ⇒ 绿 / 3 次全失败 ⇒ 红）。
        run: node scripts/ci-choco-install.mjs 7zip

      - name: Assert installer contains node runtime
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Write-Host "installer: $($exe.FullName)"
          $tmp = Join-Path $env:RUNNER_TEMP "nsis"
          New-Item -ItemType Directory -Path $tmp -Force | Out-Null
          & "C:\Program Files\7-Zip\7z.exe" x "$($exe.FullName)" "-o$tmp" "resources/node/win32-x64/node.exe" | Out-Null
          $hit = Get-ChildItem $tmp -Recurse -Filter node.exe | Select-Object -First 1
          if (-not $hit) { throw "node.exe missing from installer resources — layout regression" }
          Write-Host "PASS: node runtime present in installer"

      # Runtime smoke — release gate. Boots the REAL manager on an empty runtime,
      # lets it cold-install @deepseek-ai/dsh via the bundled pnpm from a real
      # registry, asserts dsh web reports a URL. Catches the 0.3.x bug class
      # ("npm install hangs on the monorepo tree" / "launch failed: not
      # installed") before a release ships. See scripts/smoke-windows.mjs.
      - name: Runtime smoke — manager cold-installs dsh and serves URL
        shell: pwsh
        run: node scripts/smoke-windows.mjs
        env:
          DSH_SMOKE_REGISTRY: https://registry.npmjs.org

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # Publish: on a v* tag, attach the CI-built installers (Windows + Linux) to
  # a GitHub Release, so distribution is a `git tag vX.Y.Z` away — no local
  # build needed.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh release create --generate-notes needs git history (tag diffs),
      # so this job must checkout before publishing.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dsh-desktop-windows
          path: dist-win
      - uses: actions/download-artifact@v4
        with:
          name: dsh-desktop-linux
          path: dist-linux
      # Deterministic publish with DETAILED release notes. The body is composed
      # by scripts/release-body.mjs (dsh npm latest + preinstalled plugin
      # versions + the full changelog section for this tag) — NOT the terse
      # PR-title list that `gh release create --generate-notes` produces.
      # Create-first: `gh release create` only fails when a release is already
      # ATTACHED to the tag; an untagged orphan left behind by a tag
      # delete/recreate (移 tag) never blocks it, so we always end up with a
      # properly tagged release. On failure we refresh the attached release in
      # place (assets overwritten with --clobber, body/title refreshed).
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # upload-artifact@v4 nests multi-path artifacts under their least
          # common ancestor directory (e.g. dist-linux/appimage/*.AppImage,
          # dist-linux/deb/*.deb), while single-path artifacts stay flat
          # (dist-win/*.exe). globstar + nullglob matches BOTH layouts so a
          # layout change can never silently break the publish step again.
          shopt -s nullglob globstar
          FILES=(dist-win/**/*.exe dist-linux/**/*.AppImage dist-linux/**/*.deb)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "no installers found under dist-win/dist-linux — refusing to publish an empty release"
            exit 1
          fi
          node scripts/release-body.mjs "${GITHUB_REF_NAME#v}" > "${RUNNER_TEMP}/release-body.md"
          if gh release create "${GITHUB_REF_NAME}" "${FILES[@]}" \
              --title "${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/release-body.md" \
              2>"${RUNNER_TEMP}/create.err"; then
            echo "release created (fresh, attached to ${GITHUB_REF_NAME})"
          else
            echo "create failed (a release is already attached, or an orphan blocks it)"
            cat "${RUNNER_TEMP}/create.err" >&2 || true
            # Resolve what blocked us. `gh release view` can match an untagged
            # orphan left by a tag delete/recreate (其 tag_name 字段保留原值，
            # 但 URL 是 untagged-*): delete it by id and retry create.
            if gh release view "${GITHUB_REF_NAME}" --json id,url >"${RUNNER_TEMP}/rel.json" 2>/dev/null; then
              REL_URL=$(jq -r .url "${RUNNER_TEMP}/rel.json")
              case "${REL_URL}" in
                *"untagged-"*)
                  REL_ID=$(jq -r .id "${RUNNER_TEMP}/rel.json")
                  echo "orphan release ${REL_ID} (${REL_URL}) — deleting and retrying create"
                  gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${REL_ID}" >/dev/null
                  gh release create "${GITHUB_REF_NAME}" "${FILES[@]}" \
                    --title "${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/release-body.md"
                  ;;
                *)
                  echo "release attached — refreshing assets + notes in place"
                  gh release upload "${GITHUB_REF_NAME}" "${FILES[@]}" --clobber
                  gh release edit "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" \
                    --notes-file "${RUNNER_TEMP}/release-body.md"
                  ;;
              esac
            else
              echo "no release resolved — retrying create"
              gh release create "${GITHUB_REF_NAME}" "${FILES[@]}" \
                --title "${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/release-body.md"
            fi
          fi
          gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name'
          # Sweep: a tag delete/recreate (移 tag) can leave the OLD release as
          # an untagged draft that the releases page keeps showing in the
          # Drafts section. Delete every draft/untagged leftover so a publish
          # never leaves the repo with visible junk drafts.
          #
          # Uses the REST list (not `gh release list --json id`): the runner's gh
          # does not expose an `id` field there (only createdAt/isDraft/…/tagName),
          # so that form fails with `Unknown JSON field: "id"` and reddened the
          # whole release job on v0.9.0 (2026-09-19) even though the release had
          # published fine. The REST payload has both `id` and `draft`.
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.draft == true or (.tag_name | startswith("untagged-"))) | [.id, .tag_name] | @tsv' \
          | while read -r LEFT_ID LEFT_TAG; do
              echo "sweeping leftover draft/untagged release ${LEFT_ID} (${LEFT_TAG})"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${LEFT_ID}" >/dev/null
            done

  # Linux AppImage/deb for convenience (unsigned). Windows is the primary
  # target; this job produces Linux bundles so the same repo can be tested on
  # a Linux desktop too. Full gate — main push / tag only.
  linux:
    if: github.event_name != 'pull_request'
    needs: [check, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run bundle -- --bundles appimage deb

      # Slow behavioural suite (main/tag only, ~3.5 min): the install-stall
      # fail-fast case waits out its own 180s stall window by design. It needs
      # the bundled Node fetched by `npm run bundle`'s beforeBuildCommand.
      - name: Slow behavioural tests (install stall)
        run: npm run test:slow

      # Layout assertion (mirror of the Windows one, cheaper): resources must
      # be inside the AppImage at the path the Rust probe resolves. AppImage
      # packs the app under usr/lib/<productName>/, so probe that location.
      - name: Assert AppImage contains node runtime
        run: |
          chmod +x src-tauri/target/release/bundle/appimage/*.AppImage
          ./src-tauri/target/release/bundle/appimage/*.AppImage --appimage-extract >/dev/null
          NODE=$(find squashfs-root -path "*resources/node/linux-x64/node" | head -1)
          test -n "$NODE" && test -f "$NODE" && echo "PASS: node runtime present in AppImage ($NODE)" || { echo "FAIL: resources/node missing in AppImage"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  # Runtime smoke test: actually execute the packaged binary (headless, xvfb)
  # and assert the whole chain — resources root resolution, manager spawn,
  # URL event. This is the gate that would have caught the stuck-launcher
  # class of bugs before a user ever saw them.

      # CI 能真正断言的部分：包内容完整性（比 smoke 作业可靠 —— 后者受 headless
      # WebKitGTK stall 限制，见 linux-smoke 的注释）。这一段是阻断式的：缺二进制、
      # 缺内置 node、缺 manager 模块或预装插件都会立刻让 linux 作业失败。
      - name: Verify packaged Linux layout
        run: |
          set -e
          # 不假设 cwd：直接在仓库里找 deb 产物（tauri 的 bundle 目录位置随 cwd/配置变化）
          DEB=$(find . -path "*bundle/deb/*" -name "*.deb" 2>/dev/null | head -1)
          if [ -z "$DEB" ]; then echo "FAIL: no .deb produced"; ls -la bundle 2>/dev/null || true; exit 1; fi
          echo "deb: $DEB"
          rm -rf /tmp/layout && mkdir -p /tmp/layout && dpkg-deb -x "$DEB" /tmp/layout
          APP=$(find /tmp/layout/usr/bin -maxdepth 1 -type f -perm -111 2>/dev/null | head -1)
          test -n "$APP" && test -x "$APP" || { echo "FAIL: no app binary in usr/bin"; ls -la /tmp/layout/usr/bin || true; exit 1; }
          echo "app binary: $APP"
          RES=$(dirname "$(find /tmp/layout/usr/lib -maxdepth 3 -type d -name resources | head -1)")
          test -n "$RES" && test -d "$RES/resources" || { echo "FAIL: resources dir missing"; find /tmp/layout/usr/lib -maxdepth 3 -type d | head -10; exit 1; }
          for f in node/linux-x64/node manager/server-manager.mjs manager/plugin-floor.mjs manager/shell-plugins.mjs patch/dsh-desktop.patch.yml; do
            test -e "$RES/resources/$f" || { echo "FAIL: packaged resources missing $f"; exit 1; }
          done
          # 按 package.json 里声明的**包名**匹配，而不是按目录名：磁盘上的预装目录用去 scope 的
          # 名字（dsh-smoothly-opencode-session），包名却是 @karoc/dsh-smoothly-opencode-session
          # —— 首次上线该断言时正是按目录名写错、把 scoped 包判成缺失（假红，run 36718346505）。
          for n in dsh-kanban dsh-model-reasoning dsh-turn-navigator "@karoc/dsh-smoothly-opencode-session"; do
            grep -rqs "\"name\": *\"$n\"" "$RES/resources/preinstalled"/*/package.json \
              || { echo "FAIL: preinstalled plugin missing: $n"; ls "$RES/resources/preinstalled"; exit 1; }
          done
          echo "PASS: packaged Linux layout (app binary + node + manager + patch + 4 preinstalled)"
  linux-smoke:
    # Smoke the packaged Linux binary end-to-end (manager spawn + URL event).
    #
    # 历史（重要，别再走回头路）：
    # · 2026-08-20 起这个作业**从未真正绿过**，却因为 `continue-on-error: true` 在 run 级
    #   一直显示 success —— 它已经假绿了一个多月，真回归全被它下面的红淹没。
    # · 2026-09-30（PR #66）修过"挑错二进制"（裸 `find smoke -type f -perm -111` 命中打包的
    #   Node 工具链）：run 36716676801 起能真正执行 app 了，但之后的输出只剩一条 dbind-WARNING。
    # · 2026-10-22 定性：失败**不是"资源缺失"**，而是固定的 `sleep 18` 撞上 headless 下
    #   WebKitGTK 初始化慢。证据：run 39454938815 的日志里 app 在作业结束时仍活着
    #   （runner 打印 "Terminate orphan process: … (dsh-desktop)"），而 smoke.log 里连
    #   `resources root:` 都还没出现。push 与 tag 两条路径在这一步**完全同源**（同一个
    #   download-artifact + 同一段逻辑；windows/linux/linux-smoke 的条件都是
    #   `github.event_name != 'pull_request'`），所以"tag 绿 / push 红"的差别只来自
    #   continue-on-error 对 run 级结论的掩盖，不是打包路径差异。
    #   旧报错 "resources root missing or node absent" 只是**症状**：ROOT 由 app 自己打印，
    #   而 resource_paths() 只在 node 真存在时才返回该目录 —— 真正该断言的是"这行有没有出现"。
    # · 现在的判据：scripts/ci-linux-smoke.sh —— 有界轮询（默认 180s）+ app 提前退出即失败 +
    #   失败时打印进程/GL/日志诊断。断言强度不变（resources root 必须真存在且含内置
    #   node/linux-x64/node；URL 事件必须出现）。**没有 skip / continue-on-error / `|| true`。**
    #   自检（test 作业）：静默 app、假 resources、缺 node、无 URL、早退、缺 deb 都必须红。
    if: github.event_name != 'pull_request'
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # dbus：给 GTK 一个 session bus（缺它时 accessibility/portal 探针表现为超时而非快失败）
      - run: sudo apt-get update && sudo apt-get install -y xvfb dbus libwebkit2gtk-4.1-0 libappindicator3-1 librsvg2-2 libgtk-3-0
      - uses: actions/download-artifact@v4
        with:
          name: dsh-desktop-linux
          path: artifact
      - name: Smoke test packaged binary
        env:
          ARTIFACT_DIR: artifact
        run: bash scripts/ci-linux-smoke.sh
