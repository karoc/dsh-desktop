name: build
on:
  push:
  workflow_dispatch:

# A re-cut re-pushes the same tag; cancel any run still racing on the same ref
# so release creation/asset upload never collide.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gate: compile the Rust crate in ~4-8 min (cached). Everything else
  # depends on it so compile errors never burn a full 20-min bundle round-trip.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # tauri-build validates bundle.resources at compile time, so materialize
      # the gitignored resources before checking.
      - run: node scripts/fetch-node.mjs
      - run: node scripts/sync-resources.mjs
      - run: cargo check --manifest-path src-tauri/Cargo.toml

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # beforeBuildCommand fetches the pinned Node runtime and syncs resources
      - run: npm run bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Layout assertion: the packaged installer must actually contain the
      # bundled Node at the exact path the Rust probe expects.
      - name: Install 7zip (for NSIS inspection)
        shell: pwsh
        run: choco install 7zip -y --no-progress

      - name: Assert installer contains node runtime
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Write-Host "installer: $($exe.FullName)"
          $tmp = Join-Path $env:RUNNER_TEMP "nsis"
          New-Item -ItemType Directory -Path $tmp -Force | Out-Null
          & "C:\Program Files\7-Zip\7z.exe" x "$($exe.FullName)" "-o$tmp" "resources/node/win32-x64/node.exe" | Out-Null
          $hit = Get-ChildItem $tmp -Recurse -Filter node.exe | Select-Object -First 1
          if (-not $hit) { throw "node.exe missing from installer resources — layout regression" }
          Write-Host "PASS: node runtime present in installer"

      # Runtime smoke — release gate. Boots the REAL manager on an empty runtime,
      # lets it cold-install @deepseek-ai/dsh via the bundled pnpm from a real
      # registry, asserts dsh web reports a URL. Catches the 0.3.x bug class
      # ("npm install hangs on the monorepo tree" / "launch failed: not
      # installed") before a release ships. See scripts/smoke-windows.mjs.
      - name: Runtime smoke — manager cold-installs dsh and serves URL
        shell: pwsh
        run: node scripts/smoke-windows.mjs
        env:
          DSH_SMOKE_REGISTRY: https://registry.npmjs.org

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # Publish: on a v* tag, attach the CI-built installers (Windows + Linux) to
  # a GitHub Release, so distribution is a `git tag vX.Y.Z` away — no local
  # build needed.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh release create --generate-notes needs git history (tag diffs),
      # so this job must checkout before publishing.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dsh-desktop-windows
          path: dist-win
      - uses: actions/download-artifact@v4
        with:
          name: dsh-desktop-linux
          path: dist-linux
      # Deterministic publish: any pre-existing release for this tag (e.g. a
      # stale draft from a re-cut) is deleted by id via the API — no silent
      # swallow: if deletion is impossible the step fails loudly and visibly.
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Guard on gh release view (exit 1 = no release): never parse a 404
          # response body as an id. If a stale release/draft for this tag
          # exists (re-cut), delete it loudly; otherwise proceed straight on.
          if gh release view "${GITHUB_REF_NAME}" --json id >/dev/null 2>&1; then
            echo "deleting stale release for ${GITHUB_REF_NAME}"
            gh release delete "${GITHUB_REF_NAME}" --yes
          fi
          # upload-artifact@v4 nests multi-path artifacts under their least
          # common ancestor directory (e.g. dist-linux/appimage/*.AppImage,
          # dist-linux/deb/*.deb), while single-path artifacts stay flat
          # (dist-win/*.exe). globstar + nullglob matches BOTH layouts so a
          # layout change can never silently break the publish step again.
          shopt -s nullglob globstar
          FILES=(dist-win/**/*.exe dist-linux/**/*.AppImage dist-linux/**/*.deb)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "no installers found under dist-win/dist-linux — refusing to publish an empty release"
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" "${FILES[@]}" \
            --generate-notes --title "${GITHUB_REF_NAME}"
          gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name'

  # Linux AppImage/deb for convenience (unsigned). Windows is the primary
  # target; this job produces Linux bundles so the same repo can be tested on
  # a Linux desktop too.
  linux:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run bundle -- --bundles appimage deb

      # Layout assertion (mirror of the Windows one, cheaper): resources must
      # be inside the AppImage at the path the Rust probe resolves. AppImage
      # packs the app under usr/lib/<productName>/, so probe that location.
      - name: Assert AppImage contains node runtime
        run: |
          chmod +x src-tauri/target/release/bundle/appimage/*.AppImage
          ./src-tauri/target/release/bundle/appimage/*.AppImage --appimage-extract >/dev/null
          NODE=$(find squashfs-root -path "*resources/node/linux-x64/node" | head -1)
          test -n "$NODE" && test -f "$NODE" && echo "PASS: node runtime present in AppImage ($NODE)" || { echo "FAIL: resources/node missing in AppImage"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  # Runtime smoke test: actually execute the packaged binary (headless, xvfb)
  # and assert the whole chain — resources root resolution, manager spawn,
  # URL event. This is the gate that would have caught the stuck-launcher
  # class of bugs before a user ever saw them.
  linux-smoke:
    # Known issue: WebKitGTK stalls before setup() under CI's headless xvfb
    # (binary produces zero output; same binary runs fine on a real desktop).
    # Never went green since introduction — keep it as a non-blocking canary
    # so releases are not held hostage by an environment quirk. Wins on the
    # Windows/check/linux jobs gate the release artifact.
    continue-on-error: true
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y xvfb libwebkit2gtk-4.1-0 libappindicator3-1 librsvg2-2 libgtk-3-0
      - uses: actions/download-artifact@v4
        with:
          name: dsh-desktop-linux
          path: artifact
      - name: Smoke test packaged binary
        run: |
          set -e
          cd artifact
          dpkg-deb -x deb/*.deb smoke/
          BIN=$(find smoke -type f -perm -111 | grep -vE "\.so|\.desktop" | head -1)
          echo "binary: $BIN"
          test -x "$BIN"

          # Pre-seed a stub @deepseek-ai/dsh so the manager never hits npm and
          # instead gets an immediate URL line (validates the spawn+event path).
          RT="$HOME/.local/share/dev.dsh.desktop/runtime"
          mkdir -p "$RT/node_modules/@deepseek-ai/dsh/lib"
          echo '{"name":"@deepseek-ai/dsh","version":"0.0.0-stub"}' > "$RT/node_modules/@deepseek-ai/dsh/package.json"
          cat > "$RT/node_modules/@deepseek-ai/dsh/lib/bin.js" <<'EOF'
          console.log('dsh web: http://127.0.0.1:39999')
          setInterval(() => {}, 1000)
          EOF

          # WebKitGTK under headless xvfb needs DMABUF disabled or the webview
          # init stalls before setup() runs (no Rust logs, process alive).
          DSH_DESKTOP_NO_UPDATE=1 \
          WEBKIT_DISABLE_DMABUF_RENDERER=1 \
          WEBKIT_DISABLE_COMPOSITING_MODE=1 \
          timeout 35 xvfb-run -a "$BIN" >smoke.log 2>&1 &
          APP_PID=$!
          sleep 18

          echo "== resources root line =="
          ROOT=$(grep -oE "resources root: .*" smoke.log | head -1 | sed 's/^resources root: //')
          echo "ROOT=[$ROOT]" || true
          if [ -n "$ROOT" ] && test -f "$ROOT/node/linux-x64/node"; then
            echo "PASS: resources root resolves and node exists"
          else
            echo "FAIL: resources root missing or node absent"; echo "--- smoke.log ---"; tail -50 smoke.log; exit 1
          fi

          echo "== URL event =="
          if grep -q '"t":"url"\|dsh web: http://127.0.0.1:39999' smoke.log; then
            echo "PASS: URL reached the manager protocol stream"
          else
            echo "FAIL: no URL event"; echo "--- smoke.log ---"; tail -50 smoke.log; exit 1
          fi

          # clean shutdown
          pkill -f dsh-desktop || true
          pkill -f "server-manager" || true
          sleep 2
          echo "SMOKE PASS"