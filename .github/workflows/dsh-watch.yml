# dsh 上游发布探测（自动化方案 P0，docs/2026-10-17-dsh-upgrade-automation-plan.md §3.2）
#
# 每 15 分钟看一次 npm dist-tags，只要比壳地板新就开/更新一个跟踪 issue，写上 6h 倒计时与
# 适配清单。**不创建 PR、不改地板**：适配由人/agent 按 issue 清单执行（方案 §1.1b 决策 C）。
#
# 零 secret：只用仓库自带的 GITHUB_TOKEN（issues: write）。不涉及任何新凭证。
#
# 通道口径（方案 §1.1b）：
#   6h 硬指标：`latest` 比地板新 ⇒ issue 标题带 [SLA 6h]，正文给出 起点/截止（发布 +6h）
#   best-effort ≤24h：`next` / `alpha` 比地板新 ⇒ 同机制，标题带 [best-effort 24h]
#
# 版本比较用 `sort -V`（版本序，够用且零依赖）；权威比较在适配环节由 manager 的 versionGt 与
# test-plugin-dsh-compat 承担 —— 探测阶段宁可多报一次，也不漏报。
name: dsh-watch

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: dsh-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 读地板并与 npm dist-tags 比较
        id: probe
        run: |
          set -euo pipefail
          floor=$(grep -oP "MIN_DSH_VERSION = '\K[^']+" scripts/server-manager.mjs)
          echo "壳地板（scripts/server-manager.mjs）= $floor"

          packument=$(curl -fsS --max-time 30 https://registry.npmjs.org/@deepseek-ai/dsh)
          latest=$(printf '%s' "$packument" | jq -r '."dist-tags".latest // empty')
          nexttag=$(printf '%s' "$packument" | jq -r '."dist-tags".next // empty')
          alpha=$(printf '%s' "$packument" | jq -r '."dist-tags".alpha // empty')
          echo "dist-tags: latest=$latest next=$nexttag alpha=$alpha"

          newer() { # $1 = candidate, $2 = floor → 候选比地板新则输出 yes
            [ -z "$1" ] && { echo no; return; }
            [ "$1" = "$2" ] && { echo no; return; }
            [ "$(printf '%s\n%s\n' "$2" "$1" | sort -V | tail -1)" = "$1" ] && echo yes || echo no
          }
          l6=$(newer "$latest" "$floor")
          lb=$(newer "$nexttag" "$floor")
          ab=$(newer "$alpha" "$floor")

          published=$(printf '%s' "$packument" | jq -r --arg v "$latest" '.time[$v] // empty')
          deadline=$(date -u -d "${published} + 6 hours" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || echo '?')

          {
            echo "### dsh-watch"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 壳地板 | \`$floor\` |"
            echo "| latest | \`$latest\`（发布 \`${published:-?}\`，6h 截止 \`$deadline\`）|"
            echo "| next | \`${nexttag:-—}\` |"
            echo "| alpha | \`${alpha:-—}\` |"
            echo "| latest 比地板新 | $l6 |"
            echo "| next 比地板新 | $lb |"
            echo "| alpha 比地板新 | $ab |"
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "target="
            echo "kind="
          } > /tmp/watch.env
          if [ "$l6" = yes ]; then
            echo "target=$latest" >> /tmp/watch.env
            echo "kind='SLA 6h（latest 通道，硬指标）'" >> /tmp/watch.env
            echo "deadline=$deadline" >> /tmp/watch.env
          elif [ "$lb" = yes ] || [ "$ab" = yes ]; then
            cand=$([ "$lb" = yes ] && echo "$nexttag" || echo "$alpha")
            echo "target=$cand" >> /tmp/watch.env
            echo "kind='best-effort 24h（预发布通道，只探测不自动适配）'" >> /tmp/watch.env
            echo "deadline=—" >> /tmp/watch.env
          fi
          echo "floor=$floor" >> /tmp/watch.env
          # step output：没有它，下一步的 if: 恒假 ⇒ issue 永远不会被创建（假门禁）
          target_out=$(grep -m1 '^target=' /tmp/watch.env | cut -d= -f2-)
          echo "target=$target_out" >> "$GITHUB_OUTPUT"
          echo "step output target='$target_out'"; 

      - name: 需要适配则开/更新跟踪 issue
        if: steps.probe.outputs.target != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          . /tmp/watch.env
          [ -n "$target" ] || { echo "无需适配"; exit 0; }

          gh label create dsh-upgrade --description "上游 dsh 新版本待适配" --color 1d76db 2>/dev/null || true
          existing=$(gh issue list --label dsh-upgrade --state open --json number,title \
            --jq "[.[] | select(.title | contains(\"$target\"))] | .[0].number // empty")

          body=$(cat <<EOF
          **上游 dsh \`$target\` 比壳地板 \`$floor\` 新** —— 通道口径：$kind
          6h 截止时间：\`$deadline\`（起点 = npm 上的发布时间，方案 §1.1a）

          适配清单（方案 §4，按序执行；每步产物都要有坐标）：
          1. 抬 \`MIN_DSH_VERSION\`（\`scripts/server-manager.mjs\` + \`src-tauri/resources/manager/server-manager.mjs\`）+ 注释块追加适配记录
          2. 同步 README 的地板数值（CI 有「改了 manager 必改 README」门禁）
          3. 重采夹具：\`node scripts/test-patch-targets.mjs --update-fixture --runtime <已装新版的 runtime>\`
          4. 预装插件 peer 对齐：\`node scripts/test-plugin-dsh-compat.mjs\`（地板与 bundle 必须同批）
          5. 全量门禁：\`npm test\`（23 套）
          6. 探针判据：\`node scripts/dsh-compat-probe.mjs --runtime <runtime>\` 必须 **GREEN**
          7. dev 实机验收（chrome 三上报 / 桥 / 四个预装 bundle 装载）
          8. PR → 合并 → release-please 出 tag → 构建 → 装到正式版

          卡住就在本 issue 记录：探针报告 + 具体失败项 + ETA（方案 §6 的合法失败出口）。
          EOF
          )

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "再次探测：$target 仍比地板新（$kind）。$body"
            echo "已更新 issue #$existing"
          else
            gh issue create --label dsh-upgrade --title "[dsh-watch][$kind] dsh $target 比地板 $floor 新" --body "$body"
          fi
