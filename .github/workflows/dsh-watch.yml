# dsh 上游发布探测（方案 P0 §3.2）—— 逻辑在 `scripts/dsh-watch.mjs`，本文件只是薄壳。
#
# 为什么把逻辑挪进脚本：首次实跑时因为当天没有新版本，走的是"无事发生"分支 ⇒ **建 issue 那条路径
# 从未被跑过**。提取成脚本后可以本地演练：`--force-target <v> --dry-run` 会零副作用地走完整条路径。
# 定时任务本身也用 `--dev` 之外的默认参数跑真实探测。
#
# 输入传递纪律（2026-10-19 审计修正）：workflow_dispatch 的输入**只能经 env** 进 bash。
# 旧写法把 `${{ inputs.force_target }}` 直接插进 run: 文本 —— GitHub 的表达式替换发生在 bash 解析
# **之前**，于是 `$(id;touch PWNED)` 会被当命令执行，而 step 仍然绿（审计复现过）；输入里带引号
# 还会直接造成语法错误。现在 FORCE_TARGET / DRY_RUN 走 env，bash 里用 "$FORCE_TARGET"。
#
# 零 secret（只用 GITHUB_TOKEN 的 issues: write）；不改地板、不建 PR。
#
# ⚠️ 本 workflow 是 `dsh-watch` 的**第二个写者**（另一个是本机 systemd user timer，10 分钟一次）。
# 双写者是**设计事实**，不是可以消除的巧合 —— 所以脚本里的所有写操作必须**收敛式（幂等）**：
#   · 去重键 =「标题里的版本号（词边界）+ 本脚本的标题前缀」，**不看 label**（label 是创建之后的第二次写，
#     2026-10-24 的事故里 16 条 issue 的 label/assignee 从未落地 ⇒ 按 label 过滤查到 0 条 ⇒ 每 10 分钟再建一条）；
#   · 每轮末尾做**收敛对账**（同版本多条 ⇒ 留规范单、其余评论后关闭）；
#   · 本机侧另有 flock 单写者锁与 `~/.dsh/PAUSE` 刹车，CI 侧没有（这里只有一个 runner，且不共享本机状态）。
# 退出码：0 = 正常/无事发生/对账失败但已出待人工清单；1 = 真故障（探测失败、读不到 issue 列表、
# 跟踪单没开成或没更新成）。见 README「幂等 / 单写者 / 刹车 / 对账」与
# docs/2026-10-24-alerting-and-idempotency-patterns.md 的 A1/A2/A10。
name: dsh-watch

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force_target:
        description: '演练：把该版本强制当作需要适配（留空 = 真实探测）'
        required: false
        default: ''
      dry_run:
        description: '演练：只打印将要做什么，不写 issue'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: dsh-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 比地板并（必要时）开跟踪 issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_BIN: gh
          # 输入 → 环境变量（**不要**插进 run: 文本；见文件头）
          FORCE_TARGET: ${{ inputs.force_target }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$FORCE_TARGET" ]; then args+=(--force-target "$FORCE_TARGET"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          node scripts/dsh-watch.mjs "${args[@]}"
