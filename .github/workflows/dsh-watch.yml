# dsh 上游发布探测（方案 P0 §3.2）—— 逻辑在 `scripts/dsh-watch.mjs`，本文件只是薄壳。
#
# 为什么把逻辑挪进脚本：首次实跑时因为当天没有新版本，走的是"无事发生"分支 ⇒ **建 issue 那条路径
# 从未被跑过**。提取成脚本后可以本地演练：`--force-target <v> --dry-run` 会零副作用地走完整条路径。
# 定时任务本身也用 `--dev` 之外的默认参数跑真实探测。
#
# 零 secret（只用 GITHUB_TOKEN 的 issues: write）；不改地板、不建 PR。
name: dsh-watch

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force_target:
        description: '演练：把该版本强制当作需要适配（留空 = 真实探测）'
        required: false
        default: ''
      dry_run:
        description: '演练：只打印将要做什么，不写 issue'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: dsh-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 比地板并（必要时）开跟踪 issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_BIN: gh
        run: |
          set -euo pipefail
          args=()
          [ -n "${{ inputs.force_target }}" ] && args+=(--force-target "${{ inputs.force_target }}")
          [ "${{ inputs.dry_run }}" = "true" ] && args+=(--dry-run)
          node scripts/dsh-watch.mjs "${args[@]}"
