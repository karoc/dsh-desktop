[package]
name = "dsh-desktop"
version = "0.6.0"
description = "Tauri shell for DeepSeek Harness (dsh)"
edition = "2021"

[lib]
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
notify-rust = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows-only: IShellLink + IPropertyStore to set the shortcut's
# ToastActivatorCLSID. Kept target-gated so the Linux build never pulls in the
# windows-future/windows-core cfg(windows) marshaler code that breaks Linux
# compilation.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Storage_EnhancedStorage",
    "Win32_Foundation",
    "Win32_System_Variant",
] }